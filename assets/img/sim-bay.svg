<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Ilustración de una bahía de simulador de golf">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ef"/>
      <stop offset="1" stop-color="#dff0d8"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142b1f"/>
      <stop offset="1" stop-color="#0d1f17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#room)" rx="18"/>
  <!-- pantalla del simulador -->
  <rect x="120" y="60" width="560" height="300" rx="10" fill="url(#sky)"/>
  <path d="M120 300 Q400 200 680 290 L680 360 L120 360 Z" fill="#7ab648"/>
  <path d="M330 330 Q400 305 470 328 L470 360 L330 360 Z" fill="#a4d465"/>
  <circle cx="560" cy="120" r="26" fill="#fff8dc" opacity="0.9"/>
  <path d="M430 330 l3-96" stroke="#f2f5f1" stroke-width="3"/>
  <path d="M433 234 l22 8-22 8z" fill="#e8433f"/>
  <!-- suelo de hierba -->
  <rect x="60" y="400" width="680" height="60" rx="8" fill="#2c5136"/>
  <rect x="330" y="392" width="140" height="18" rx="4" fill="#3e6b47"/>
  <!-- golfista estilizado -->
  <g stroke="#f2f5f1" stroke-width="7" stroke-linecap="round" fill="none">
    <circle cx="255" cy="330" r="16" fill="#f2f5f1" stroke="none"/>
    <path d="M255 348 v52"/>
    <path d="M255 362 l-34 -18"/>
    <path d="M255 362 l30 -26"/>
    <path d="M255 400 l-20 40"/>
    <path d="M255 400 l22 38"/>
    <path d="M285 336 l44 44" stroke-width="4"/>
  </g>
  <circle cx="338" cy="388" r="5" fill="#ffffff"/>
  <!-- foco de techo -->
  <rect x="360" y="20" width="80" height="10" rx="5" fill="#1b3527"/>
  <path d="M400 30 L340 60 h120 Z" fill="#2eb05c" opacity="0.2"/>
</svg>
